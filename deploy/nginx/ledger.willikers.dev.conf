# Forever Ledger API -> PM2 app forever-ledger-api on 127.0.0.1:3410.
# Install: sudo cp deploy/nginx/ledger-noquery-log.conf /etc/nginx/conf.d/ledger-noquery-log.conf
#            (log_format ledger_noquery, used below; log_format must live in the http block, so it has its own file)
#          sudo cp deploy/nginx/ledger.willikers.dev.conf /etc/nginx/sites-available/ledger.willikers.dev
#          sudo ln -s /etc/nginx/sites-available/ledger.willikers.dev /etc/nginx/sites-enabled/
#          sudo certbot certonly --standalone -d ledger.willikers.dev   (once DNS points here)
#          sudo nginx -t && sudo systemctl reload nginx
# This VPS has global certbot hooks (renewal-hooks/pre|post) that stop and start nginx around every renewal,
# so use --standalone. `certbot --nginx` here started a second nginx outside systemd and webroot can't answer.
server {
    listen 80;
    listen [::]:80;
    server_name ledger.willikers.dev;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ledger.willikers.dev;

    ssl_certificate /etc/letsencrypt/live/ledger.willikers.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.willikers.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTPS only from now on (1 year). `always` also sends it on 4xx/5xx. A location with its own add_header would
    # drop this one, so none of the locations below use add_header.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Uploader batches stay under 4 MB; the API itself rejects anything over 5 MB.
    client_max_body_size 6m;

    location /v1/ {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin panel (SPA + /admin/api + /admin/auth), served by the same API process.
    location = /admin {
        return 301 /admin/;
    }

    # Battle.net login. The callback's query string carries the OAuth code and state: log the path only, to its own
    # file (ledger_noquery comes from ledger-noquery-log.conf in conf.d).
    location /admin/auth/ {
        access_log /var/log/nginx/ledger-auth.access.log ledger_noquery;
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Zone map uploads (admin only): raw PNG/WebP/JPEG bodies up to 8 MB, above the site default. The API checks the
    # admin session and CSRF before reading the body, and refuses anything over 8 MB itself too.
    location /admin/api/maps/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
