# Forever Ledger API -> PM2 app forever-ledger-api on 127.0.0.1:3410.
# Install: sudo cp deploy/nginx/ledger.willikers.dev.conf /etc/nginx/sites-available/ledger.willikers.dev
#          sudo ln -s /etc/nginx/sites-available/ledger.willikers.dev /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d ledger.willikers.dev   (once DNS points here)
server {
    listen 80;
    listen [::]:80;
    server_name ledger.willikers.dev;

    # Uploader batches stay under 4 MB; the API itself rejects anything over 5 MB.
    client_max_body_size 6m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/html;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
