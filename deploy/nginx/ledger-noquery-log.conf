# log_format for the Forever Ledger /admin/auth/ access log: logs $uri (path only), never $request, so OAuth codes
# and states in the callback's query string never reach a log file.
#
# log_format is only valid in the http block, so this file is NOT part of the site file. Install it once, BEFORE
# the site file that uses it (Ubuntu's /etc/nginx/nginx.conf includes conf.d/*.conf inside http {}):
#   sudo cp deploy/nginx/ledger-noquery-log.conf /etc/nginx/conf.d/ledger-noquery-log.conf
#   sudo nginx -t && sudo systemctl reload nginx
log_format ledger_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';
