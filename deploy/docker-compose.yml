# Postgres for Forever Ledger. The API runs under PM2 (ecosystem.config.cjs) behind Nginx, not in Docker.
# Usage: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: forever-ledger

services:
  postgres:
    image: postgres:18-alpine
    container_name: forever-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forever_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: America/Chicago
      PGTZ: America/Chicago
    command: ['postgres', '-c', 'timezone=America/Chicago', '-c', 'log_timezone=America/Chicago']
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5440}:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ledger} -d ${POSTGRES_DB:-forever_ledger}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
